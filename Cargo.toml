[workspace]
resolver = "3"
members = ["crates/unkludge-protocol", "crates/unkludge-cli", "crates/unkludge-app", "tools/kbini2toml"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
