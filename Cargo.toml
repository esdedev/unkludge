[workspace]
resolver = "3"
members = ["crates/unkludge-protocol", "crates/unkludge-shared", "crates/unkludge-cli", "crates/unkludge-app", "tools/kbini2toml"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[profile.release]
# For size. What's slow here is the keyboard, and decoding a large GIF stays quick with this.
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
# Command-line parsing for the `unkludge` binary. No colours, no suggestions: only what it uses.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# The local time for `unkludge clock`. The protocol crate takes the time from its callers.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# hidraw on Linux needs libudev, not libusb. The Windows backend is Rust, with no C to build.
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-static-hidraw", "windows-native"] }
# Decoders for the images users upload. Encoders come with them, and only tests use those.
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "jpeg", "bmp", "webp"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# The process list and Ctrl+C on Windows. Already in the tree through hidapi.
windows-sys = "=0.61.2"
# The Windows interface: Direct2D, DirectWrite, the tray and the dialogs. Its COM object for screen
# readers needs this crate rather than `windows-sys`.
windows = "=0.62.2"
windows-core = "=0.62.2"
windows-numerics = "=0.3.1"
# Ctrl+C on Linux. Already in the tree through hidapi.
libc = "=0.2.191"
# The Linux interface: drawn in software, on X11 and Wayland, with no GPU libraries to depend on.
# Screen readers need `accessibility`. Dropped files and the screen's size need `unstable-winit-030`,
# which is an API and no code of its own, and is why this stays pinned to one version.
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030"] }
# The Linux tray. No `tokio`: a thread of its own is all it needs.
ksni = { version = "=0.3.7", default-features = false, features = ["blocking", "async-io"] }
# The Linux interface's tests look through what screen readers would see.
i-slint-backend-testing = "=1.18.1"
