[workspace]
resolver = "3"
members = ["crates/unkludge-protocol", "crates/unkludge-cli", "crates/unkludge-app", "tools/kbini2toml"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-only"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
# Command-line parsing for the `unkludge` binary. No colours, no suggestions: only what it uses.
clap = { version = "=4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
# The local time for `unkludge clock`. The protocol crate takes the time from its callers.
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
# hidraw on Linux needs libudev, not libusb. The Windows backend is Rust, with no C to build.
hidapi = { version = "=2.6.7", default-features = false, features = ["linux-static-hidraw", "windows-native"] }
# Decoders for the images users upload. Encoders come with them, and only tests use those.
image = { version = "=0.25.10", default-features = false, features = ["gif", "png", "jpeg", "bmp", "webp"] }
serde = { version = "=1.0.229", features = ["derive"] }
thiserror = "=2.0.21"
toml = { version = "=1.1.8", default-features = false, features = ["std", "serde", "parse"] }
# The process list on Windows. Already in the tree through hidapi.
windows-sys = "=0.61.2"
