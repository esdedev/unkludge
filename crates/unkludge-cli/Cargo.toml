[package]
name = "unkludge-cli"
description = "Command-line tool for Royal Kludge keyboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "unkludge"
path = "src/main.rs"

[dependencies]
unkludge-protocol = { path = "../unkludge-protocol" }
unkludge-shared = { path = "../unkludge-shared" }
chrono.workspace = true
clap.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Console"] }

[target.'cfg(not(windows))'.dependencies]
libc.workspace = true

[dev-dependencies]
unkludge-protocol = { path = "../unkludge-protocol", features = ["fake"] }
image.workspace = true
