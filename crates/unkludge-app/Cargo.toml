[package]
name = "unkludge-app"
description = "Desktop app for Royal Kludge keyboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "unkludge-app"
path = "src/main.rs"

[dependencies]
unkludge-protocol = { path = "../unkludge-protocol" }
unkludge-shared = { path = "../unkludge-shared" }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true

[dev-dependencies]
unkludge-protocol = { path = "../unkludge-protocol", features = ["fake"] }
image.workspace = true
