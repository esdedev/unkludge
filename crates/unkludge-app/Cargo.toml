[package]
name = "unkludge-app"
description = "Desktop app for Royal Kludge keyboards"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "unkludge-app"
path = "src/main.rs"

[dependencies]
unkludge-protocol = { path = "../unkludge-protocol" }
chrono.workspace = true

[dev-dependencies]
unkludge-protocol = { path = "../unkludge-protocol", features = ["fake"] }
image.workspace = true
